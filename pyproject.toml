[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovpackage"
version = "0.2.1"
description = "Workflow for reproducible asset packaging and publishing."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "typer>=0.16",
    "toml>=0.10.2",
    "gitignore-parser>=0.1.11",
    "prompt-toolkit>=3.0.47",
    "pydantic>=2.9",
    "networkx>=3.3",
    "semver>=3.0.2",
    "rich>=13.7.1",
]

[project.optional-dependencies]
local = ["aiofiles>=23.2.1"]
s3 = ["aioboto3"]
azure = ["azure-storage-blob>=12.25.1", "aiohttp>=3.11.18"]
gcs = ["google-cloud-storage>=3.9.0"]
storage-api = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0, <1.73.0dev0",
    "grpcio-tools>=1.71.0, <1.73.0dev0",
    "requests>=2.32.3",
    "keyring>=25.0.0",
]
all = [
    "aiofiles>=23.2.1",
    "aioboto3",
    "azure-storage-blob>=12.25.1",
    "aiohttp>=3.11.18",
    "google-cloud-storage>=3.9.0",
    "grpcio>=1.71.0, <1.73.0dev0",
    "grpcio-tools>=1.71.0, <1.73.0dev0",
    "requests>=2.32.3",
    "keyring>=25.0.0",
]
test = [
    "pytest>=8.3.1",
    "pytest-asyncio>=0.23.8",
    "pytest-bdd>=7.2.0",
    "pytest-cov>=5.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "deepdiff>=8.0.0",
    "jsonschema>=4.23.0",
]

[project.scripts]
ovpackage = "ovpackage.cli:run"
wrapp = "wrapp.cli:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ovpackage*", "wrapp*", "nvidia*", "wrapp_examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
import_mode = "prepend"
markers = [
    "xdist_incompatible: Tests that cannot run with pytest-xdist parallelization",
]
