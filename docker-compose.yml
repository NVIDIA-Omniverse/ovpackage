services:
  minio:
    build: docker/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root
    ports:
      - "9000:9000"
      - "9001:9001"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command:
      [
        "azurite",
        "--skipApiVersionCheck",
        "--blobHost",
        "0.0.0.0",
        "--queueHost",
        "0.0.0.0",
        "--tableHost",
        "0.0.0.0",
      ]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  fake-gcs:
    image: fsouza/fake-gcs-server:1.49.0
    command: ["-scheme", "http", "-port", "4443"]
    ports:
      - "4443:4443"
