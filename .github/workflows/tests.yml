name: tests

on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .[local,s3,azure,gcs,test]
      - name: Unit tests
        run: make test
      - name: Emulator tests
        run: |
          make start-test-services
          make test-emulators
        env:
          WRAPP_AWS_ACCESS_KEY_ID: minio-root
          WRAPP_AWS_SECRET_ACCESS_KEY: minio-root
          WRAPP_AZURE_ACCOUNT_NAME: devstoreaccount1
          WRAPP_AZURE_CONNECTION_STRING: UseDevelopmentStorage=true
      - name: Stop services
        if: always()
        run: make stop-test-services

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in fresh venv
        run: |
          python -m venv smokevenv
          smokevenv/bin/pip install dist/*.whl
      - name: CLI smoketest
        run: |
          smokevenv/bin/ovpackage --help
          smokevenv/bin/ovpackage version
          smokevenv/bin/wrapp --help
